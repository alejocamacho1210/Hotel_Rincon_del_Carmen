<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel El Rincón del Carmen</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/elements.css">

</head>

<body>
    <input type="checkbox" id="menu-toggle">
    <aside class="sidebar">
        <h2>RINCON DEL CARMEN</h2>
        <br>
        <nav>
            <a href=""></a>
        </nav>
    </aside>
    <header>
        <div class="logo">
            <img src="" alt="">
        </div>
        <div class="config_lang">

        </div>
        <h1>
            RINCON DEL CARMEN
        </h1>
        <label for="menu-toggle" class="menu-btn">☰</label>
    </header>

    <main>
        <h2>¡APROVECHA NUESTRAS OFERTAS DE VERANO!</h2>
        <img src="/src/images/flayer_promocional.png" alt="promociondeverano">

        <h2>Carrusel de habitaciones</h2>
        <section class="rooms_type">
            <div class="tarjeta">
                <h3>Habitación estandar king</h3>
                <img src="/src/images/estandar_king.jpeg" alt="habitacion estandar king">
                <a href="">Aparta la tuya</a>
            </div>

        </section>

        <h2>AREAS DEL HOTEL</h2>
        <section class="hotel_areas">
            <div>
                <h3>Spa</h3>
                <img src="/src/images/spa.jpeg" alt="spa">
            </div>
            <div>

            </div>
            <div>

            </div>
            <div>

            </div>
            <div>

            </div>

        </section>

        <h3>MUESTRAS FOTOGRAFICAS</h3>
        <section class="photos">
            <div>

            </div>
        </section>

    </div>

    <footer>
        <h2>¿QUIERES QUE TE CONTACTEMOS?</h2>
        <form>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Ingresa tu nombre">

            <br><br>

            <label for="ciudad">Ciudad:</label>
            <input type="text" id="ciudad" placeholder="Ingresa tu ciudad">

            <br><br>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" placeholder="Ingresa tu teléfono">

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Ingresa tu correo">

            <br><br>

            <button type="submit">Enviar</button>

        </form>
    </footer>
</body>

</html>
