<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel El Rincón del Carmen</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/elements.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body>

    <div class="home-page">

        <section class="hero">

            <nav class="top-nav">
                <button class="nav-btn">Registrarse</button>
                <button class="nav-btn">Iniciar sesión</button>
            </nav>

            <div class="hero-overlay">
                <span class="hero-tag">✦ Hotel 5 Estrellas</span>
                <h1 class="hero-title">Rincón del Carmen</h1>
                <p class="hero-text">Vive una experiencia única de lujo y confort en el corazón del Caribe colombiano.</p>
            </div>

        </section>

        <section class="gallery-section">
            <h2 class="section-title">Nuestras Habitaciones</h2>
            <div class="gallery gallery-grid"></div>
        </section>

        <section class="areas-section">
            <h2 class="section-title">Áreas del Hotel</h2>
            <div class="areas-grid"></div>
        </section>

        <section class="contact-section">
         <div class="contact-tabs">
                <button class="contact-tab active">¿Quieres que te contactemos?</button>
                <button class="contact-tab" onclick="location.href='pag-03.html'">📍 ¿Dónde nos ubicamos?</button>
         </div>
            <p class="contact-sub">Déjanos tus datos y nos ponemos en contacto contigo.</p>
            <form class="contact-form">
                <input type="text" placeholder="Tu nombre">
                <input type="text" placeholder="Tu ciudad">
                <input type="tel" placeholder="Tu teléfono">
                <input type="email" placeholder="Tu correo">
                <button type="submit">Enviar</button>
            </form>
        </section>

    </div>

    <div class="modal register-modal">
        <div class="modal-box">
            <h2>Crear cuenta</h2>
            <form class="modal-form">
                <input type="text" placeholder="Número de documento">
                <input type="text" placeholder="Nombre completo">
                <input type="text" placeholder="País">
                <input type="email" placeholder="Correo electrónico">
                <input type="tel" placeholder="Teléfono">
                <input type="password" placeholder="Contraseña">
                <button type="submit">Registrarse</button>
            </form>
        </div>
    </div>

    <div class="modal login-modal">
        <div class="modal-box">
            <h2>Iniciar sesión</h2>
            <form class="modal-form">
                <input type="text" placeholder="Nombre completo">
                <input type="text" placeholder="Número de documento">
                <input type="password" placeholder="Contraseña">
                <button type="submit">Ingresar</button>
            </form>
        </div>
    </div>

    <div class="room-modal">
        <div class="room-view">
            <button class="back-room">← Volver</button>
            <img class="room-preview" src="" alt="">
            <div class="room-details">
                <h2 class="room-title"></h2>
                <div class="room-description"></div>
            </div>
        </div>
    </div>

    <script src="/src/js/initRooms.js"></script>

    <script src="/src/js/Webcomponent_pag-01.js"></script>

</body>

</html>
