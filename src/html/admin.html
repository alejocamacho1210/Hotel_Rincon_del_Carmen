<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Panel Administrador
    </title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/elements.css">

</head>

<body>

    <main class="admin-page">

        <section class="admin-hero">

            <h1>
                Panel Administrador
            </h1>

            <p>
                Gestiona habitaciones, reservas y usuarios.
            </p>

        </section>


        <section class="admin-actions">

            <article class="admin-card">

                <h2>
                    Habitaciones
                </h2>

                <p>
                    Editar precios, disponibilidad y servicios.
                </p>

            </article>


            <article class="admin-card">

                <h2>
                    Reservas
                </h2>

                <p>
                    Gestionar reservas activas de clientes.
                </p>

            </article>


            <article class="admin-card">

                <h2>
                    Usuarios
                </h2>

                <p>
                    Ver usuarios registrados.
                </p>

            </article>

        </section>

    </main>

    <script src="../js/admin.js"></script>

</body>

</html>
