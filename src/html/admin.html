<!-- admin.html -->

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Panel Administrador</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/elements.css">

</head>

<body>

    <main class="admin-page">

        <section class="admin-hero">

            <h1 class="admin-title">
                Panel Administrativo
            </h1>

            <p class="admin-subtitle">
                Gestiona habitaciones, reservas y disponibilidad del hotel.
            </p>

        </section>


        <!-- ESTADISTICAS -->
        <section class="admin-stats">

            <article class="admin-stat-card">

                <h3>Total Habitaciones</h3>

                <span id="totalRooms">
                    0
                </span>

            </article>


            <article class="admin-stat-card">

                <h3>Habitaciones Disponibles</h3>

                <span id="availableRooms">
                    0
                </span>

            </article>

        </section>


        <!-- HABITACIONES -->
        <section>

            <h2 class="admin-section-title">
                Gestión de Habitaciones
            </h2>

            <section
                class="admin-rooms-grid"
                id="adminRoomsGrid"
            >

            </section>

        </section>


        <!-- RESERVAS -->
        <section class="admin-reservations-section">

            <h2 class="admin-section-title">
                Reservaciones realizadas
            </h2>

            <section
                class="admin-reservations-grid"
                id="adminReservationsGrid"
            >

            </section>

        </section>

    </main>

    <script src="/src/js/initRooms.js"></script>
    <script src="../js/admin.js"></script>

</body>

</html>
