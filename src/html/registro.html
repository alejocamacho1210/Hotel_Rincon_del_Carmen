<!-- registro.html -->

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Hotel El Rincón del Carmen</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/elements.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body>

    <main class="register-page">

        <section class="register-container">

            <div class="register-header">

                <span class="register-tag">
                    ✦ Completa tu registro
                </span>

                <h1>
                    Crea tu cuenta
                </h1>

                <p>
                    Regístrate para continuar con tu reserva y disfrutar de una experiencia exclusiva.
                </p>

            </div>


            <form class="register-form" id="register-form">

                <input type="text" id="documento" placeholder="Número de documento">

                <input type="text" id="nombre" placeholder="Nombre completo">

                <input type="text" id="pais" placeholder="País">

                <input type="email" id="correo" placeholder="Correo electrónico">

                <input type="tel" id="telefono" placeholder="Teléfono">

                <input type="password" id="password" placeholder="Contraseña">

                <button type="submit">
                    Crear cuenta
                </button>

            </form>

        </section>

    </main>

    <script type="module" src="../js/registro.js"></script>

</body>

</html>
